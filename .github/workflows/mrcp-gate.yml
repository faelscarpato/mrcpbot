name: MRCP Mutation Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  governance-gate:
    name: Evaluate Mutation Gate Policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mutation Gate & Core Governance Tests
        run: pnpm test packages/core/lib/governance/gate.test.ts packages/core/lib/analysis/structural-rag.test.ts
